{{- if .Values.minio.enabled }}
# MinIO — S3-compatible object storage for dataset + pipeline data.
# When enabled, the driver + agents get HITORRO_STORAGE_S3_* env
# pointing at the in-cluster Service so basefile's MinioProtocolAdapter
# routes s3:// URIs to this instance.
#
# Data lives on a PVC — retention across pod restarts. For multi-node
# distributed MinIO deployments swap the StatefulSet replicas to N
# and follow the MinIO Operator's guidance on erasure-code sets.
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hitorro-mesh.fullname" . }}-minio-creds
  labels:
    {{- include "hitorro-mesh.labels" . | nindent 4 }}
    role: storage
type: Opaque
stringData:
  root-user:     {{ .Values.minio.rootUser | quote }}
  root-password: {{ .Values.minio.rootPassword | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hitorro-mesh.fullname" . }}-minio
  labels:
    {{- include "hitorro-mesh.labels" . | nindent 4 }}
    app: hitorro-minio
    role: storage
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  selector:
    app: hitorro-mesh
    role: storage
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "hitorro-mesh.fullname" . }}-minio
  labels:
    {{- include "hitorro-mesh.labels" . | nindent 4 }}
    role: storage
spec:
  replicas: 1
  serviceName: {{ include "hitorro-mesh.fullname" . }}-minio
  selector:
    matchLabels:
      app: hitorro-mesh
      role: storage
  template:
    metadata:
      labels:
        {{- include "hitorro-mesh.labels" . | nindent 8 }}
        role: storage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "hitorro-mesh.fullname" . }}-minio-creds
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hitorro-mesh.fullname" . }}-minio-creds
                  key: root-password
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [{{ .Values.minio.storage.accessMode | quote }}]
        {{- with .Values.minio.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.minio.storage.size | quote }}
{{- if .Values.minio.bucketInit.enabled }}
---
# One-shot Job to create the default bucket after MinIO boots.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hitorro-mesh.fullname" . }}-minio-bucket-init
  labels:
    {{- include "hitorro-mesh.labels" . | nindent 4 }}
    role: storage
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: "{{ .Values.minio.bucketInit.image.repository }}:{{ .Values.minio.bucketInit.image.tag }}"
          env:
            - name: MC_HOST_local
              value: "http://$(USER):$(PASS)@{{ include "hitorro-mesh.fullname" . }}-minio:9000"
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "hitorro-mesh.fullname" . }}-minio-creds
                  key: root-user
            - name: PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "hitorro-mesh.fullname" . }}-minio-creds
                  key: root-password
            - name: BUCKET
              value: {{ .Values.minio.bucket | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              # Wait until MinIO is reachable (Service DNS + healthcheck).
              until mc ls local >/dev/null 2>&1; do sleep 2; done
              mc mb --ignore-existing "local/$BUCKET"
              echo "bucket $BUCKET ready"
{{- end }}
{{- end }}
